name: CI — Main Gate

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  db-contracts:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: hq_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run DB contract tests
        env:
          TEST_DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/hq_test"
        run: bash db/tests/run-db-tests.sh

  coverage-report:
    runs-on: ubuntu-latest
    needs: []
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: ".nvmrc"
          cache: "npm"
          cache-dependency-path: apps/ui/package-lock.json
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: ".python-version"
      - run: npm ci --legacy-peer-deps
        working-directory: apps/ui
      - run: pip install -e '.[test]'
      - name: UI coverage
        working-directory: apps/ui
        run: npx vitest run --coverage
      - name: Gateway coverage
        run: pytest gateway/tests -x -q --cov=gateway --cov-report=term-missing
      - name: Upload coverage artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-reports
          path: |
            apps/ui/coverage/
          retention-days: 14
